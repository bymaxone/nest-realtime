# Dependabot keeps dependencies and GitHub Actions up to date.
#
# Updates are proposed as PRs only — they never merge automatically — so peer-range
# and major-bump decisions are always made by a human before anything lands.
version: 2

updates:
  # npm devDependencies and peerDependencies. Production `dependencies` is empty by
  # design (zero direct deps), so this effectively tracks tooling and peer ranges.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # ORDER MATTERS: a dependency joins only the FIRST group whose conditions it
      # matches, so any narrower group must precede the catch-all below.

      # The commitlint CLI and its shared config are released in lockstep and are
      # only compatible pairwise. Split across two PRs, merging either one alone
      # leaves a mismatched pair that breaks the `commit-msg` hook for every
      # contributor — locally, where no CI check ever runs it. Grouping all update
      # types (major included) keeps them in one reviewable change.
      commitlint:
        patterns:
          - '@commitlint/*'
        update-types:
          - major
          - minor
          - patch

      # `react` and `react-dom` must be the exact same version — React itself
      # throws "Incompatible React versions" and every suite that renders a hook
      # fails to run. Split across two PRs, NEITHER passes CI: each one alone
      # leaves the pair mismatched. Observed on #50/#55 before this group existed.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - major
          - minor
          - patch

      # The typescript-eslint parser and plugin are released together and the
      # plugin peer-depends on a matching parser. Split, the second PR conflicts
      # on the lockfile the moment the first lands — observed on #53/#54.
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
        update-types:
          - major
          - minor
          - patch

      # Batch low-risk dev tooling bumps into a single PR to cut review noise.
      # Majors stay out: each one needs its own verification and its own revert.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Peer dependencies define the supported consumer range — bumping them is a
      # breaking-change decision made deliberately, not by an automated minor bump.
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@socket.io/redis-adapter'
        update-types: [version-update:semver-major]
      - dependency-name: ioredis
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: reflect-metadata
        update-types: [version-update:semver-major]
      - dependency-name: rxjs
        update-types: [version-update:semver-major]
      - dependency-name: 'socket.io'
        update-types: [version-update:semver-major]
      - dependency-name: 'socket.io-client'
        update-types: [version-update:semver-major]
      # TypeScript 6 and ESLint 10 are known to break the lint/typecheck gate and
      # are intentionally held back until revisited.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # `@types/node` majors track the Node release line. `engines` declares
      # `>=24`, so typechecking against a newer major would let code compile
      # against APIs absent from the oldest runtime this package claims to
      # support. Raise the floor in `engines` first, then lift this hold.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # The workflow actions themselves (checkout, setup-node, pnpm, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      # init, analyze and upload-sarif are one product shipped as three actions
      # and they refuse to work across versions: analyze fails with "Loaded a
      # configuration file for version 'X', but running version 'Y'". Bumped
      # separately, the first PR to land breaks the CodeQL job until the rest
      # follow — observed on #58.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
        update-types:
          - major
          - minor
          - patch
