# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The rules that must not vary between Bymax repositories are
# edited there; everything this repository writes for itself lives outside the
# markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. That is
# why this is a sync and not a `uses:` — the reusable CI above it propagates by
# reference, this one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly. Thursday rather than Monday, and off the hour: every other
    # scheduled workflow here runs Monday (03:33 mutation-full, 06:00 codeql,
    # 06:17 peer-advisory-drift, 07:00 scorecard) or on the daily 06:00 e2e, and
    # a sync pull request should not land in the same window as those.
    - cron: '23 7 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # A GitHub App rather than a personal access token: the credential is
      # minted per run and expires within the hour, so there is nothing to
      # rotate and nothing that can expire unnoticed. The two are read together
      # and the called workflow fails loudly if only one is set, rather than
      # falling back to a token nobody supplied.
      #
      # `sync-token` is deliberately not mapped. A mapping whose secret does not
      # exist resolves to the empty string, which is the failure this file most
      # needs to avoid: the run keeps using the default GITHUB_TOKEN, whose pull
      # requests start no workflow runs, so the sync pull request cannot satisfy
      # this repository's required checks while the workflow looks configured.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
