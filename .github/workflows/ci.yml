# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (lint, typecheck, unit + coverage, mutation) run via
# node-lib-ci.yml so every repo shares one definition. This library's build,
# bundle-size budget, and its in-process e2e suite stay here. The Redis-dependent
# cross-instance suite is excluded from the per-PR path and runs on a daily
# schedule in e2e-cross-instance.yml. Mutation runs only on a push to main /
# manual dispatch, never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: false # no format:check script; prettier runs via lint/pre-commit
      run-build: false # build + size verified in the `verify` job below
      unit-command: pnpm test:cov # unit coverage across the server/shared/react projects
      run-mutation: true
      mutation-source-globs: '^(src/)'

  verify:
    # NAME IS A CONTRACT: the `nest-realtime-pr-and-ci-gates` ruleset requires the
    # status check `Verify build + size` by this exact string. Renaming the job
    # makes the required check vanish rather than fail, and every pull request
    # blocks forever waiting for a check that no longer reports. The gates this
    # job gained are steps inside it, which is what actually gates the merge.
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check:published` cross-checks every release tag against a CHANGELOG
          # section. The default checkout is shallow and carries no tags, so the
          # check would find nothing and pass — the silent no-op it exists to
          # prevent.
          fetch-depth: 0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        run: |
          for subpath in internal server websocket shared react; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath/index.$ext" ]; then
                echo "Missing dist/$subpath/index.$ext"
                exit 1
              fi
            done
          done
          echo "Every entry point produced ESM + CJS + .d.ts + .d.cts"
      - name: Verify published type resolution
        # A source-level typecheck compiles `src`, so it cannot catch a broken
        # `exports` map: a consumer resolving through the packed tarball may still
        # land on declarations for the wrong module format. `attw` packs the
        # tarball and resolves every entrypoint the way each resolution mode would.
        run: pnpm check:exports
      - name: Verify the published surface matches the documentation
        # The README's links resolve and its TypeScript snippets compile against
        # `dist/` resolved through the `exports` map, and every `v*.*.*` tag has a
        # CHANGELOG section — the tags being an outside source of truth the file
        # cannot contradict about itself.
        run: pnpm check:published
      - name: Bundle size budget and bundle boundaries
        # Also structural: the Socket.IO stack must not appear in the bundles an
        # SSE application loads, and the entry points must import the shared
        # runtime rather than inline it — a copy would give its classes and
        # `Symbol`s a second identity, and every injection token would fail.
        run: pnpm size
      - name: Public surface
        # A type exported for consumers and referenced nowhere internally can
        # disappear from a barrel with `tsc`, `attw` and the README snippets all
        # still green. The snapshot turns that into a reviewable diff.
        run: pnpm check:surface
      - name: Consumer runtime
        # The only gate that boots NestJS against the packed tarball, in ESM and
        # in CommonJS. Every other gate reads the source or the declarations, so
        # a defect in how the entry points are bundled is invisible to them.
        run: pnpm check:runtime

  e2e:
    name: E2E (in-process)
    # Gate behind verify so a PR that fails a fast gate (build / size) skips e2e.
    # The Redis cross-instance suite is excluded here and runs daily via
    # e2e-cross-instance.yml.
    needs: [ci, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: E2E tests (cross-instance suite excluded)
        run: pnpm test:e2e

  security:
    # Dependency review needs the dependency graph (public repos, or private + GHAS).
    # Gated on visibility so it starts running automatically once this repo is public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral — the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, verify, e2e, security]
    runs-on: ubuntu-latest
    # Once this is the required check, a hung runner holds every merge behind it
    # for GitHub's default of six hours. The job is one comparison, so a short
    # ceiling costs nothing and bounds that.
    timeout-minutes: 5
    steps:
      # Printed on success as well as failure. Without it the check reports a bare
      # red X and the reader has to open each dependency to find which one broke.
      - name: Report the result of every dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Named for what the condition does: `skipped` is deliberately not a failure
      # here, so "did not succeed" would describe a stricter gate than this is.
      - name: Fail when any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
