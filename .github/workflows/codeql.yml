# Static security analysis (CodeQL) for JavaScript/TypeScript.
#
# `push` on the default branch matters beyond redundancy with `pull_request`:
# Scorecard's SAST check scores the ratio of commits that were scanned, and a
# PR-only trigger leaves every squashed merge commit unscanned. That showed up
# as `SAST tool detected but not run on all commits`.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # CodeQL code scanning needs GitHub Advanced Security, free only on public
  # repositories — gate on public visibility so it is skipped (CI green) while the
  # repository is private and runs automatically once it is public.
  analyze:
    name: analyze
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
