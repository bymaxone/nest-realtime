# CodeQL — thin caller of the org-wide reusable analysis (bymaxone/.github).
#
# The whole definition, including the public-repository gate that decides
# whether scanning may run at all, lives in bymaxone/.github so the licensing
# rule exists once rather than in every repository that copies it.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

# Added to match the rest of the libraries: without it, repeated pushes to a
# branch leave several analyses of the same ref running at once.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for anything that does not declare its own. The `codeql` job
# below replaces this set rather than intersecting with it, so this floor governs
# any job added later that forgets to think about it.
permissions:
  contents: read

jobs:
  # Job id is the convention across the org: it prefixes the reported check,
  # so every repo shows `codeql / Analyze (<language>)` under the same name.
  codeql:
    # Declared on the calling job, which is the only place that reaches the
    # called workflow: a job that sets its own permissions replaces the
    # workflow-level set rather than intersecting with it, and a called
    # workflow cannot be granted more than its caller holds.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: bymaxone/.github/.github/workflows/codeql.yml@bcd95609cd724e6d86168f3dd6e40eff4d2077ad # v1
    with:
      # Added to match the rest of the libraries. Audit policy: it records the
      # job's outbound calls and blocks nothing, so it cannot fail a build that
      # was passing, and it makes an unexpected destination visible.
      harden-runner: true
      # Added to match the rest of the libraries: a superset of the default
      # suite, so this analyses strictly more than before rather than less.
      queries: security-extended
