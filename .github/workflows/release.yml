# Tag-driven release workflow. Triggered only by pushing a `v*` tag.
# Publishes @bymax-one/nest-realtime to npm with OIDC provenance attestation.
# The publish job is gated by the `npm-publish` environment (manual approval required).
# This workflow is INERT until a human pushes a tag — never auto-triggered on PRs or branches.
# Authentication is npm OIDC trusted publishing — there is no NPM_TOKEN secret
# to configure. It must be set up once for the package on npmjs.com.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: publish
    runs-on: ubuntu-latest
    # The `npm-publish` environment gates the run behind a manual approval and is
    # itself restricted to `v*.*.*` tags (repo Settings → Environments). Even an
    # accidentally pushed tag cannot publish without an explicit approval click.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@bymax-one/nest-realtime
    permissions:
      id-token: write # required for OIDC trusted publishing (provenance)
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guard: the pushed tag MUST match the version in package.json.
      # Prevents accidental publishes caused by a mismatched tag.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package.json version '${PKG_VERSION}'" >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${PKG_VERSION} ✓"

      - name: Run prepublishOnly gate
        run: pnpm prepublishOnly

      - name: Run bundle-size gate
        run: pnpm size

      - name: Verify published type resolution
        # Runs after the build inside prepublishOnly and before the publish, so a
        # tag cannot ship a tarball whose `exports` map resolves to declarations
        # for the wrong module format. It cannot live in prepublishOnly itself:
        # attw packs the tarball, and the nested pack inside `pnpm publish`
        # resolves to a path that does not exist.
        #
        # `check:published` needs no step here — it packs nothing, so it lives in
        # prepublishOnly and already ran in the step above.
        run: pnpm check:exports

      - name: Publish to npm (with provenance)
        # `npm publish`, not `pnpm publish`. The registry's `readme` field is
        # populated from the publish request, and it is empty for every package
        # here published under pnpm 11 while every one published under pnpm 10
        # — which delegated to the npm CLI — carries it. The same split shows in
        # `_npmVersion`, present only on the publishes the npm CLI performed. An
        # empty `readme` means the npm package page renders no documentation at
        # all, which is where people actually read it.
        #
        # No `NODE_AUTH_TOKEN` and no `NPM_TOKEN` secret: authentication is OIDC
        # trusted publishing, where the npm CLI exchanges the GitHub OIDC token
        # (`id-token: write` above) for a short-lived publish credential. This
        # step used to set `NODE_AUTH_TOKEN` from a secret that does not exist in
        # this repository, so it resolved to an empty string — an empty token
        # offered to npm rather than no token at all. The four sibling libraries
        # that publish successfully from CI set neither.
        run: npm publish --provenance --access public

      - name: Extract release notes from CHANGELOG
        # Pulls out the section for the tag being released, so the Release body is
        # the notes for THIS version rather than the entire file — which is what
        # `body_path: CHANGELOG.md` published, growing with every release. Falls
        # back to a pointer when the section is not found; `check:published`
        # already fails the build in that case, so the fallback is a safety net,
        # not the expected path.
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](./CHANGELOG.md) for details."
          fi
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Notes are passed through an env var, NOT `${{ ... }}` interpolation, so
        # backticks and `$()` inside the CHANGELOG cannot be evaluated by bash —
        # otherwise changelog content executes arbitrary commands on the runner.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES"
