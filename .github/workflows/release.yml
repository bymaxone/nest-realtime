# Tag-driven release workflow. Triggered only by pushing a `v*` tag.
# Publishes @bymax-one/nest-realtime to npm with OIDC provenance attestation.
# The publish job is gated by the `npm-publish` environment (manual approval required).
# This workflow is INERT until a human pushes a tag — never auto-triggered on PRs or branches.
# NODE_AUTH_TOKEN is read from the NPM_TOKEN repository secret; configure it before the first release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: publish
    runs-on: ubuntu-latest
    # The `npm-publish` environment gates the run behind a manual approval and is
    # itself restricted to `v*.*.*` tags (repo Settings → Environments). Even an
    # accidentally pushed tag cannot publish without an explicit approval click.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@bymax-one/nest-realtime
    permissions:
      id-token: write # required for OIDC trusted publishing (provenance)
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guard: the pushed tag MUST match the version in package.json.
      # Prevents accidental publishes caused by a mismatched tag.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package.json version '${PKG_VERSION}'" >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${PKG_VERSION} ✓"

      - name: Run prepublishOnly gate
        run: pnpm prepublishOnly

      - name: Run bundle-size gate
        run: pnpm size

      - name: Verify published type resolution
        # Runs after the build inside prepublishOnly and before the publish, so a
        # tag cannot ship a tarball whose `exports` map resolves to declarations
        # for the wrong module format. It cannot live in prepublishOnly itself:
        # attw packs the tarball, and the nested pack inside `pnpm publish`
        # resolves to a path that does not exist.
        #
        # `check:published` needs no step here — it packs nothing, so it lives in
        # prepublishOnly and already ran in the step above.
        run: pnpm check:exports

      - name: Publish to npm (with provenance)
        run: pnpm publish --provenance --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: false
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
