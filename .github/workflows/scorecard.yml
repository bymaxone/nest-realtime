# OpenSSF Scorecard supply-chain health checks; results published to the
# code-scanning dashboard and to the public Scorecard API that backs the README
# badge.
#
# `push` on the default branch matters as much as the schedule: the API only
# knows a repository once a run has published for it, so a weekly-only trigger
# leaves the badge reporting `invalid repo path` for up to a week after the
# repository becomes public — which is exactly what happened here.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # OpenSSF Scorecard publishes SARIF to code scanning (GitHub Advanced Security),
  # free only on public repositories — gate on public visibility.
  analysis:
    name: analysis
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
