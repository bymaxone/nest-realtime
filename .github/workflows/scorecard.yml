# OpenSSF Scorecard supply-chain health checks; results published to the
# code-scanning dashboard and to the public Scorecard API that backs the README
# badge.
#
# `push` on the default branch matters as much as the schedule: the API only
# knows a repository once a run has published for it, so a weekly-only trigger
# leaves the badge reporting `invalid repo path` for up to a week after the
# repository becomes public — which is exactly what happened here.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Retried rather than trusted once: a rate limit or a blip would
          # otherwise decide whether the repository counts as public.
          visibility=""
          for attempt in 1 2 3; do
            visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null) && break
            sleep $(( attempt * 5 ))
          done

          if [ -z "$visibility" ]; then
            # Degrade to "not public" instead of failing the workflow. The scan
            # cannot run without knowing, and a red workflow over a transient API
            # error is noise; the warning keeps it from being silent.
            echo "::warning::Could not determine repository visibility after 3 attempts; treating it as non-public."
            echo "public=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            # Covers internal as well as private: neither can publish results.
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped on a $visibility repository."
          fi

  # OpenSSF Scorecard publishes SARIF to code scanning (GitHub Advanced Security),
  # free only on public repositories — gate on public visibility.
  analysis:
    name: analysis
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
